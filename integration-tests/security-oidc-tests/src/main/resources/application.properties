vaadin.security.login-path=/q/oidc/login

quarkus.log.category."com.github.mcollovati.quarkus.hilla.security.QuarkusAccessPathChecker".level=DEBUG
quarkus.log.category."com.github.mcollovati.quarkus.hilla.security.HillaSecurityPolicy".level=DEBUG

quarkus.oidc.application-type=service
quarkus.oidc.client-id=quarkus-app
quarkus.oidc.credentials.secret=secret
quarkus.oidc.roles.role-claim-path=groups

quarkus.keycloak.devservices.realm-name=quarkus
quarkus.keycloak.devservices.users.user=user
quarkus.keycloak.devservices.users.admin=admin
quarkus.keycloak.devservices.users.guest=guest
quarkus.keycloak.devservices.users.mapped=mapped
quarkus.keycloak.devservices.users.transport=transport
quarkus.keycloak.devservices.roles.user=USER
quarkus.keycloak.devservices.roles.admin=USER,ADMIN
quarkus.keycloak.devservices.roles.guest=GUEST
quarkus.keycloak.devservices.roles.mapped=source-global
quarkus.keycloak.devservices.roles.transport=source-transport

quarkus.http.auth.roles-mapping.source-global=GLOBAL_USER

quarkus.http.auth.permission.public-flow.paths=/flow-public
quarkus.http.auth.permission.public-flow.policy=permit
quarkus.http.auth.permission.protected-flow.paths=/flow-protected
quarkus.http.auth.permission.protected-flow.policy=authenticated
quarkus.http.auth.permission.bearer-only-flow.paths=/flow-bearer-only
quarkus.http.auth.permission.bearer-only-flow.auth-mechanism=bearer
quarkus.http.auth.permission.bearer-only-flow.policy=authenticated
quarkus.http.auth.permission.user-flow.paths=/flow-user
quarkus.http.auth.permission.user-flow.policy=user
quarkus.http.auth.permission.admin-flow.paths=/flow-admin
quarkus.http.auth.permission.admin-flow.policy=admin
quarkus.http.auth.permission.annotation-stricter-flow.paths=/flow-annotation-stricter
quarkus.http.auth.permission.annotation-stricter-flow.policy=permit
quarkus.http.auth.permission.config-stricter-flow.paths=/flow-config-stricter
quarkus.http.auth.permission.config-stricter-flow.policy=admin
quarkus.http.auth.permission.combined-roles-flow.paths=/flow-combined-roles
quarkus.http.auth.permission.combined-roles-flow.policy=admin
quarkus.http.auth.permission.denied-flow.paths=/flow-denied
quarkus.http.auth.permission.denied-flow.policy=permit
quarkus.http.auth.permission.global-denied-flow.paths=/flow-global-denied
quarkus.http.auth.permission.global-denied-flow.policy=permit
quarkus.http.auth.permission.global-role-flow.paths=/flow-global-role
quarkus.http.auth.permission.global-role-flow.policy=global-user
quarkus.http.auth.permission.transport-role-flow.paths=/flow-transport-role
quarkus.http.auth.permission.transport-role-flow.policy=permit
quarkus.http.auth.permission.target-reauthentication-flow.paths=/flow-target-reauthentication
quarkus.http.auth.permission.target-reauthentication-flow.policy=permit
quarkus.http.auth.permission.permission-only-flow.paths=/flow-permission-only
quarkus.http.auth.permission.permission-only-flow.policy=user
quarkus.http.auth.permission.named-policy-flow.paths=/flow-named-policy
quarkus.http.auth.permission.named-policy-flow.policy=named-navigation-policy
quarkus.http.auth.permission.lowercase-method-flow.paths=/flow-lowercase-method
quarkus.http.auth.permission.lowercase-method-flow.methods=get
quarkus.http.auth.permission.lowercase-method-flow.policy=permit
quarkus.http.auth.permission.rest-encoded.paths=/rest/encoded
quarkus.http.auth.permission.rest-encoded.policy=user
quarkus.http.auth.permission.rest-dot.paths=/rest/dot
quarkus.http.auth.permission.rest-dot.policy=user
quarkus.http.auth.permission.transport-navigation.paths=/connect/SecureEndpoint/transportNavigationDecision
quarkus.http.auth.permission.transport-navigation.policy=transport-roles
quarkus.http.auth.permission.endpoint-denied.paths=/connect/SecureEndpoint/denied
quarkus.http.auth.permission.endpoint-denied.policy=permit
quarkus.http.auth.policy.user.roles-allowed=USER
quarkus.http.auth.policy.admin.roles-allowed=ADMIN
quarkus.http.auth.policy.global-user.roles-allowed=GLOBAL_USER
quarkus.http.auth.policy.transport-roles.roles-allowed=source-transport
quarkus.http.auth.policy.transport-roles.roles.source-transport=TARGET_USER
